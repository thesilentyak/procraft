# Release pipeline: pushing a version tag (v0.0.1-beta, v0.2.0, v1.0.0-rc.1, …) builds, and makes a
# draft GitHub release named after the tag (with an empty "What's Changed" section: fill it in on
# GitHub and publish the draft) of:
#
#   procraft-<version>-android-arm64.apk          64-bit ARM tablets, signed with the release key
#   procraft-<version>-android-legacy-armeabi-v7a.apk   older 32-bit ARM tablets, signed likewise (named to list after arm64)
#   procraft-<version>-windows-x64.msi            the desktop app's installer (packaging/windows)
#   procraft-<version>-windows-x64-portable.zip   the desktop app to run from anywhere
#   procraft-<version>-windows-arm64.msi          the same for Windows on ARM (Snapdragon PCs)
#   procraft-<version>-windows-arm64-portable.zip
#   procraft-<version>-linux-x86_64.AppImage      any distro (packaging/linux)
#   procraft-<version>-linux-x86_64.deb           Debian, Ubuntu and the like
#   procraft-<version>-linux-x86_64.tar.gz        the plain tree
#   procraft-<version>-linux-aarch64.AppImage     the same three for 64-bit ARM (Raspberry Pi 4 and 5,
#   procraft-<version>-linux-aarch64.deb          ARM laptops and boards)
#   procraft-<version>-linux-aarch64.tar.gz
#   procraft-<version>-macos-universal.dmg        Apple silicon and Intel Macs (packaging/macos):
#                                                 signed with a Developer ID and notarized when
#                                                 the APPLE_* secrets exist, else ad hoc
#   procraft-<version>-ipados-unsigned.ipa        the iPad app (ios/), unsigned: sideloading tools
#                                                 (AltStore, SideStore, Sideloadly) sign it with the
#                                                 user's own Apple ID
#   SHA256SUMS.txt                                each file's SHA-256
#
# The Mac and iPad files are built on the public repository alone (a private one pays for macOS
# runners' minutes, ten times Linux's), and only once the repository's variables RELEASE_MAC and
# RELEASE_IPAD are true. While they are new, their failing leaves their files out rather than
# holding up the release; so do Windows on ARM's and Linux on ARM's (also built on the public
# repository alone).
#
# A manual run (Actions › Release › Run workflow) is a dry run: it builds them at the version in
# gradle.properties (the iPad's whatever RELEASE_IPAD says) and keeps them as the run's artifacts,
# and releases nothing. It also signs the iPad app with the team's certificate and profile when
# the IOS_* secrets exist (procraft-<version>-ipados.ipa), for testers whose devices the profile
# lists; that one is never released.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  # never cancel a release halfway; a newer push waits its turn
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUST_VERSION: "1.99.0"
  NDK_VERSION: "29.0.14206865"

jobs:
  apk:
    name: APK
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - id: v
        name: Resolve version
        run: |
          listed="$(sed -n 's/^procraft\.version=//p' android/gradle.properties)"
          if [ "$GITHUB_REF_TYPE" = tag ]; then v="${GITHUB_REF_NAME#v}"; else v="$listed"; fi
          if ! printf '%s' "$v" | grep -Eq '^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$'; then
            echo "::error::'$v' is not a version like 1.2.3 or 1.2.3-beta"
            exit 1
          fi
          # the tag must be the version gradle.properties names
          if [ "$v" != "$listed" ]; then
            echo "::error::the tag is v$v but gradle.properties says procraft.version=$listed: set it (and procraft.versionCode) before tagging"
            exit 1
          fi
          echo "version=$v" >>"$GITHUB_OUTPUT"
          echo "### v$v (\`${GITHUB_SHA::9}\`)" >>"$GITHUB_STEP_SUMMARY"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: aarch64-linux-android, armv7-linux-androideabi

      - uses: Swatinem/rust-cache@v2
        with:
          key: release-android

      - name: Install cargo-ndk and the Android NDK
        run: |
          # the version F-Droid's build of the same tag installs, so its APKs come out the same as ours
          cargo install cargo-ndk --version 4.1.2 --locked
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;$NDK_VERSION" >/dev/null
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/$NDK_VERSION" >>"$GITHUB_ENV"

      - name: Release key
        env:
          KEYSTORE_BASE64: ${{ secrets.PROCRAFT_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            printf '%s' "$KEYSTORE_BASE64" | base64 -d >"$RUNNER_TEMP/release.p12"
            echo "PROCRAFT_KEYSTORE=$RUNNER_TEMP/release.p12" >>"$GITHUB_ENV"
          elif [ "$GITHUB_REF_TYPE" = tag ]; then
            echo "::error::No release key: a release is never signed with the debug key"
            exit 1
          else
            echo "::warning::No release key: this dry run is signed with the debug key"
          fi

      - uses: gradle/actions/setup-gradle@v4

      - name: Build
        working-directory: android
        env:
          VERSION: ${{ steps.v.outputs.version }}
          PROCRAFT_KEYSTORE_PASSWORD: ${{ secrets.PROCRAFT_KEYSTORE_PASSWORD }}
          PROCRAFT_KEY_ALIAS: ${{ secrets.PROCRAFT_KEY_ALIAS }}
          PROCRAFT_KEY_PASSWORD: ${{ secrets.PROCRAFT_KEY_PASSWORD }}
        run: |
          mkdir -p "$GITHUB_WORKSPACE/dist"
          for build in arm64-v8a:arm64 armeabi-v7a:legacy-armeabi-v7a; do
            ./gradlew --no-daemon :app:assembleRelease "-Pprocraft.abis=${build%:*}" "-Pprocraft.version=$VERSION"
            cp app/build/outputs/apk/release/app-release.apk "$GITHUB_WORKSPACE/dist/procraft-$VERSION-android-${build#*:}.apk"
          done

      - name: APK
        run: |
          apksigner="$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -n 1)apksigner"
          echo >>"$GITHUB_STEP_SUMMARY"
          for apk in dist/*.apk; do
            certs="$("$apksigner" verify --print-certs "$apk")"
            if [ "$GITHUB_REF_TYPE" = tag ] && grep -q "CN=Android Debug" <<<"$certs"; then
              echo "::error::$apk is signed with the debug key"
              exit 1
            fi
            {
              echo "    $(basename "$apk")"
              grep -E "certificate (DN|SHA-256)" <<<"$certs" | sed 's/^/      /'
            } >>"$GITHUB_STEP_SUMMARY"
          done

      - uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: dist/*
          if-no-files-found: error

      - name: Remove the release key
        if: always()
        run: rm -f "$RUNNER_TEMP/release.p12"

  desktop:
    name: Desktop (${{ matrix.name }})
    strategy:
      matrix:
        include:
          - name: windows-x64
            os: windows-2025
          # an older Ubuntu, so the binary runs on any distro with glibc 2.35 or newer
          - name: linux-x86_64
            os: ubuntu-22.04
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    env:
      DIST: ${{ github.workspace }}/dist
    steps:
      - uses: actions/checkout@v4

      - id: v
        name: Resolve version
        run: |
          listed="$(sed -n 's/^procraft\.version=//p' android/gradle.properties | tr -d '\r')"
          if [ "$GITHUB_REF_TYPE" = tag ]; then v="${GITHUB_REF_NAME#v}"; else v="$listed"; fi
          echo "version=$v" >>"$GITHUB_OUTPUT"

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_VERSION }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: release-desktop-${{ matrix.name }}

      - name: Install WiX v5
        if: runner.os == 'Windows'
        run: |
          dotnet tool install --global wix --version 5.0.2
          echo "$USERPROFILE/.dotnet/tools" >>"$GITHUB_PATH"
          "$USERPROFILE/.dotnet/tools/wix" extension add -g WixToolset.UI.wixext/5.0.2 WixToolset.Util.wixext/5.0.2

      - name: Package for Windows
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          VERSION: ${{ steps.v.outputs.version }}
        run: ./packaging/windows/package.ps1

      - name: Install nfpm
        if: runner.os == 'Linux'
        run: |
          curl -fsSL https://github.com/goreleaser/nfpm/releases/download/v2.47.0/nfpm_2.47.0_Linux_x86_64.tar.gz | tar -xz -C "$RUNNER_TEMP" nfpm
          sudo install -m755 "$RUNNER_TEMP/nfpm" /usr/local/bin/nfpm
          sudo apt-get install -y --no-install-recommends desktop-file-utils >/dev/null

      - name: Package for Linux
        if: runner.os == 'Linux'
        env:
          VERSION: ${{ steps.v.outputs.version }}
        run: bash packaging/linux/package.sh

      - name: Files
        run: ls -l dist >>"$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: release-desktop-${{ matrix.name }}
          path: dist/*
          if-no-files-found: error

  macos:
    name: Desktop (macos-universal)
    # only once the Mac app is to ship: the repository's variable RELEASE_MAC set to true
    if: ${{ !github.event.repository.private && vars.RELEASE_MAC == 'true' }}
    continue-on-error: true
    runs-on: macos-15
    env:
      DIST: ${{ github.workspace }}/dist
    steps:
      - uses: actions/checkout@v4

      - id: v
        name: Resolve version
        run: |
          listed="$(sed -n 's/^procraft\.version=//p' android/gradle.properties | tr -d '\r')"
          if [ "$GITHUB_REF_TYPE" = tag ]; then v="${GITHUB_REF_NAME#v}"; else v="$listed"; fi
          echo "version=$v" >>"$GITHUB_OUTPUT"

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: aarch64-apple-darwin, x86_64-apple-darwin

      - uses: Swatinem/rust-cache@v2
        with:
          key: release-desktop-macos-universal

      - name: Set up Developer ID signing and notarization
        # without the secrets (forks, dry runs) the app stays signed ad hoc, not notarized
        env:
          APPLE_CERTIFICATE_P12: ${{ secrets.APPLE_CERTIFICATE_P12 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: bash packaging/macos/signing.sh --setup

      - name: Package for macOS
        env:
          VERSION: ${{ steps.v.outputs.version }}
        run: bash packaging/macos/package.sh

      - name: Remove the signing keychain and key
        if: always()
        run: bash packaging/macos/signing.sh --cleanup

      - name: Files
        run: ls -l dist >>"$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: release-desktop-macos-universal
          path: dist/*
          if-no-files-found: error

  # the iPad app: unsigned for sideloading tools; on manual runs also signed for testers
  ipados:
    name: iPadOS (IPA)
    # released once the repository's variable RELEASE_IPAD is true; built on manual runs always
    if: ${{ !github.event.repository.private && (github.event_name == 'workflow_dispatch' || vars.RELEASE_IPAD == 'true') }}
    continue-on-error: true
    runs-on: macos-15
    env:
      DIST: ${{ github.workspace }}/dist
    steps:
      - uses: actions/checkout@v4

      - id: v
        name: Resolve version
        run: |
          listed="$(sed -n 's/^procraft\.version=//p' android/gradle.properties | tr -d '\r')"
          if [ "$GITHUB_REF_TYPE" = tag ]; then v="${GITHUB_REF_NAME#v}"; else v="$listed"; fi
          echo "version=$v" >>"$GITHUB_OUTPUT"

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: aarch64-apple-ios

      - uses: Swatinem/rust-cache@v2
        with:
          key: release-ipados

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Build the IPA
        env:
          VERSION: ${{ steps.v.outputs.version }}
          # the Recent artwork widget comes along once the repository's variable IPAD_WIDGET is
          # true (its signing set up: ios/widget.yml)
          PROCRAFT_WIDGET: ${{ vars.IPAD_WIDGET == 'true' && 'YES' || 'NO' }}
        run: bash ios/build-ipa.sh

      - name: Sign the IPA for testers
        # manual runs only, never released: it installs on the profile's devices alone. Without
        # the secrets (forks, before they are set) nothing is signed; a failed signing leaves the
        # unsigned .ipa as it is
        if: ${{ github.event_name == 'workflow_dispatch' }}
        continue-on-error: true
        env:
          VERSION: ${{ steps.v.outputs.version }}
          SIGNED_DIST: ${{ github.workspace }}/signed
          IOS_CERTIFICATE_P12: ${{ secrets.IOS_CERTIFICATE_P12 }}
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          IOS_PROVISIONING_PROFILE: ${{ secrets.IOS_PROVISIONING_PROFILE }}
          IOS_WIDGET_PROVISIONING_PROFILE: ${{ secrets.IOS_WIDGET_PROVISIONING_PROFILE }}
        run: bash ios/sign-ipa.sh

      - name: Files
        run: ls -l dist signed 2>/dev/null >>"$GITHUB_STEP_SUMMARY" || true

      - uses: actions/upload-artifact@v4
        with:
          name: release-ipados
          path: dist/*
          if-no-files-found: error

      # kept apart from the release files, and briefly: it carries the team's certificate and the
      # profile's device list
      - uses: actions/upload-artifact@v4
        if: ${{ github.event_name == 'workflow_dispatch' }}
        with:
          name: ipados-signed-for-testers
          path: signed/*
          if-no-files-found: ignore
          retention-days: 3

  # Windows on ARM: cross-built on the x64 runner, which has Visual Studio's ARM64 build tools
  windows-arm64:
    name: Desktop (windows-arm64)
    runs-on: windows-2025
    continue-on-error: true
    defaults:
      run:
        shell: bash
    env:
      DIST: ${{ github.workspace }}/dist
    steps:
      - uses: actions/checkout@v4

      - id: v
        name: Resolve version
        run: |
          listed="$(sed -n 's/^procraft\.version=//p' android/gradle.properties | tr -d '\r')"
          if [ "$GITHUB_REF_TYPE" = tag ]; then v="${GITHUB_REF_NAME#v}"; else v="$listed"; fi
          echo "version=$v" >>"$GITHUB_OUTPUT"

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: aarch64-pc-windows-msvc

      - uses: Swatinem/rust-cache@v2
        with:
          key: release-desktop-windows-arm64

      - name: Install WiX v5
        run: |
          dotnet tool install --global wix --version 5.0.2
          echo "$USERPROFILE/.dotnet/tools" >>"$GITHUB_PATH"
          "$USERPROFILE/.dotnet/tools/wix" extension add -g WixToolset.UI.wixext/5.0.2 WixToolset.Util.wixext/5.0.2

      - name: Package for Windows on ARM
        shell: pwsh
        env:
          VERSION: ${{ steps.v.outputs.version }}
          ARCH: arm64
        run: ./packaging/windows/package.ps1

      - name: Files
        run: ls -l dist >>"$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: release-desktop-windows-arm64
          path: dist/*
          if-no-files-found: error

  # Linux on 64-bit ARM: built on GitHub's ARM runner, on the public repository alone (a private
  # one has no ARM runners on its plan); an older Ubuntu, as for x86_64, for glibc 2.35 or newer
  linux-aarch64:
    name: Desktop (linux-aarch64)
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-22.04-arm
    continue-on-error: true
    env:
      DIST: ${{ github.workspace }}/dist
    steps:
      - uses: actions/checkout@v4

      - id: v
        name: Resolve version
        run: |
          listed="$(sed -n 's/^procraft\.version=//p' android/gradle.properties | tr -d '\r')"
          if [ "$GITHUB_REF_TYPE" = tag ]; then v="${GITHUB_REF_NAME#v}"; else v="$listed"; fi
          echo "version=$v" >>"$GITHUB_OUTPUT"

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_VERSION }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: release-desktop-linux-aarch64

      - name: Install nfpm
        run: |
          curl -fsSL https://github.com/goreleaser/nfpm/releases/download/v2.47.0/nfpm_2.47.0_Linux_arm64.tar.gz | tar -xz -C "$RUNNER_TEMP" nfpm
          sudo install -m755 "$RUNNER_TEMP/nfpm" /usr/local/bin/nfpm
          sudo apt-get update >/dev/null
          sudo apt-get install -y --no-install-recommends desktop-file-utils >/dev/null

      # the AppImage, .deb and .tar.gz for aarch64 (package.sh builds for the machine it runs on)
      - name: Package for Linux on ARM
        env:
          VERSION: ${{ steps.v.outputs.version }}
        run: bash packaging/linux/package.sh

      - name: Files
        run: ls -l dist >>"$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: release-desktop-linux-aarch64
          path: dist/*
          if-no-files-found: error

  release:
    name: GitHub Release
    needs: [apk, desktop, windows-arm64, linux-aarch64, macos, ipados]
    # the Mac, iPad, Windows on ARM and Linux on ARM jobs may have been skipped (a private
    # repository, their variables unset) or left out their files
    if: ${{ github.ref_type == 'tag' && !cancelled() && needs.apk.result == 'success' && needs.desktop.result == 'success' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          merge-multiple: true
          path: dist

      - name: Checksums
        run: (cd dist && sha256sum -- * >SHA256SUMS.txt && cat SHA256SUMS.txt >>"$GITHUB_STEP_SUMMARY")

      - name: Draft the release
        run: |
          gh release create "$GITHUB_REF_NAME" --draft --verify-tag --title "$GITHUB_REF_NAME" --notes "## What's Changed" -- dist/*
          echo "Draft **$GITHUB_REF_NAME** is ready: fill in What's Changed and publish it." >>"$GITHUB_STEP_SUMMARY"
